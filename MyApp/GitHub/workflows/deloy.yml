name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # メインブランチにプッシュされたときに自動実行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build # ※プロジェクトのビルドコマンドに合わせて調整

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # ビルドされたファイルが出力されるフォルダ名（distやbuildなど）
          